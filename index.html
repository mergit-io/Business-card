<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mergit Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Only the card, face on, at a real card's 3.5 x 2 proportion. Every size is in cqw, so it scales like print.
   Front: the company. Turn it over: the team, in the same design. */
:root {
  --ink: #090b14; --ink-2: #121628;     /* card stock */
  --paper: #ffffff; --paper-2: #b9bfd3; --paper-3: #7b8299;
  --mint: #7fe6c0; --mint-deep: #0f5c45; --lilac: #b8a9ff;
  --room: #e9ebf0;
  --display: "Syne", "Arial Black", system-ui, sans-serif;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--room); font-family: var(--sans); display: grid; place-items: center; padding: 16px }

.scene { width: min(92vw, 620px); container-type: inline-size; perspective: 1800px }
.card { position: relative; width: 100%; aspect-ratio: 3.5 / 2; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3,.7,.2,1) }
.flipped .card { transform: rotateY(180deg) }
.face { position: absolute; inset: 0; border-radius: 3.4cqw; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: linear-gradient(150deg, var(--ink-2), var(--ink) 65%); color: var(--paper); cursor: pointer;
  box-shadow: 0 6cqw 9cqw -5cqw rgb(9 11 20 / .55), 0 .4cqw 1cqw rgb(9 11 20 / .18) }
.face.back { transform: rotateY(180deg) }
/* the one shared mark of both faces: a mint panel on the right edge */
.panel { position: absolute; right: 0; top: 0; bottom: 0; width: 34%; background: var(--mint); color: var(--ink) }
.turn { position: absolute; left: 6cqw; bottom: 6cqw; display: inline-flex; align-items: center; gap: 1.4cqw; padding: 0; border: 0; background: none; cursor: pointer;
  font: 500 1.9cqw var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--paper-3) }
.turn svg { width: 2.4cqw; height: 2.4cqw }
.turn:hover { color: var(--paper) }
a:focus-visible, .turn:focus-visible { outline: .5cqw solid var(--mint); outline-offset: .6cqw; border-radius: .6cqw }

/* ---------- front ---------- */
.lockup { position: absolute; left: 6cqw; top: 6.5cqw; display: flex; align-items: center; gap: 2.4cqw }
.lockup svg { width: 7.4cqw; height: 7.4cqw; flex: none }
.word { margin: 0; font: 800 6.2cqw/1 var(--display); letter-spacing: -.02em }
.claim { position: absolute; left: 6cqw; top: 22cqw; margin: 0; width: 52%; font: 600 3.9cqw/1.18 var(--display); letter-spacing: -.01em; text-wrap: balance }
.claim em { font-style: normal; color: var(--mint) }
.site { position: absolute; left: 6cqw; top: 37cqw; display: inline-flex; align-items: center; gap: 1.2cqw; color: var(--paper); text-decoration: none;
  font: 500 2.5cqw var(--mono); padding-bottom: .4cqw; border-bottom: .25cqw solid var(--mint) }
.site svg { width: 2.4cqw; height: 2.4cqw; color: var(--mint) }
.site:hover { color: var(--mint) }
.front .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqw }
.qr { background: var(--paper); padding: 1.3cqw; border-radius: 1.8cqw; line-height: 0 }
.qr img, .qr canvas { width: 17cqw !important; height: 17cqw !important; display: block }
.panel small { font: 500 1.9cqw var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mint-deep) }

/* ---------- back: same stock, same mint panel, the team in place of the claim ---------- */
.people { position: absolute; left: 6cqw; right: calc(34% + 4cqw); top: 4.6cqw; bottom: 4.6cqw; margin: 0; padding: 0; list-style: none;
  display: grid; grid-template-rows: repeat(5, 1fr) }
.person { display: flex; align-items: center; gap: 2cqw; border-bottom: .2cqw solid rgb(255 255 255 / .09); min-width: 0 }
.person:last-child { border-bottom: 0 }
.name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .3cqw; color: var(--paper); text-decoration: none }
.name b { font: 600 3.4cqw/1.1 var(--sans); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.name span { font: 400 2.1cqw var(--mono); color: var(--paper-3) }
.name:hover b { color: var(--mint) }
.icons { display: flex; gap: 1.4cqw; flex: none }
.icons a { width: 6.2cqw; height: 6.2cqw; border-radius: 50%; display: grid; place-items: center; color: var(--paper);
  border: .25cqw solid rgb(255 255 255 / .22); transition: background-color .2s ease, color .2s ease, border-color .2s ease }
.icons a:hover { background: var(--mint); border-color: var(--mint); color: var(--ink) }
.icons svg { width: 2.7cqw; height: 2.7cqw }
.back .panel { display: flex; flex-direction: column; justify-content: space-between; padding: 5.5cqw 4.6cqw }
.back .panel .lockup { position: static }
.back .panel .lockup { gap: 1.6cqw }
.back .panel .lockup svg { width: 5cqw; height: 5cqw }
.back .panel .word { font-size: 3.8cqw }
.team-title { margin: 0; font: 800 5.4cqw/1 var(--display); letter-spacing: -.02em }
.team-title span { display: block; margin-top: 1.4cqw; font: 500 1.9cqw var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mint-deep) }
.back .site { position: static; color: var(--ink); border-bottom-color: var(--ink); font-size: 2.3cqw; align-self: flex-start }
.back .site svg { color: var(--ink) }
.back .site:hover { color: var(--mint-deep) }
.back .turn { position: static; color: var(--mint-deep); align-self: flex-start }
.back .turn:hover { color: var(--ink) }
@media (prefers-reduced-motion: reduce) { .card { transition: none } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mg-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6f8ea"/><stop offset="1" stop-color="#7fe6c0"/></linearGradient>
  <linearGradient id="mg-bot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4deff"/><stop offset="1" stop-color="#b8a9ff"/></linearGradient>
  <symbol id="mg" viewBox="0 0 256 256">
    <path fill="url(#mg-top)" d="M52 16L180 16A36 36 0 0 1 180 88L175.17 88A8 8 0 0 1 168.31 84.13L141.69 39.95A16 16 0 0 0 114.28 39.95L87.66 84.13A8 8 0 0 1 80.8 88L52 88A36 36 0 0 1 52 16Z"/>
    <path fill="url(#mg-bot)" d="M76 240L204 240A36 36 0 0 0 204 168L179.99 168A8 8 0 0 0 173.47 171.37L141.03 217.05A16 16 0 0 1 114.94 217.05L82.52 171.37A8 8 0 0 0 76 168A36 36 0 0 0 76 240Z"/>
    <path fill="#7DE3BE" d="M127.99 48.21L79.01 129.48L127.99 107.22Z"/><path fill="#A9EED5" d="M127.99 48.21L127.99 107.22L176.97 129.48Z"/>
    <path fill="#3CCB98" d="M79.01 129.48L127.99 158.43L127.99 107.22Z"/><path fill="#62B8E6" d="M127.99 107.22L127.99 158.43L176.97 129.48Z"/>
    <path fill="#8FA2F6" d="M127.99 167.71L127.99 207.79L79.01 138.77Z"/><path fill="#B19FFF" d="M127.99 167.71L176.99 138.77L127.99 207.79Z"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z" fill="currentColor"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3V9.75zM9.5 9.75h3.8v1.6h.06c.53-1 1.84-2.06 3.78-2.06 4.04 0 4.79 2.66 4.79 6.12V21h-4v-4.97c0-1.19-.02-2.71-1.65-2.71-1.65 0-1.9 1.29-1.9 2.62V21h-4V9.75z" fill="currentColor"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-turn" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.3 6.4L3 16M3 21v-5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="scene" id="scene">
  <div class="card">
    <section class="face front" aria-label="Mergit">
      <div class="lockup"><svg aria-hidden="true"><use href="#mg"/></svg><p class="word">Mergit</p></div>
      <p class="claim">AI agents that do real work. <em>Proof you can verify.</em></p>
      <a class="site" href="https://app.mergit.site" target="_blank" rel="noopener">app.mergit.site<svg aria-hidden="true"><use href="#i-out"/></svg></a>
      <button class="turn" type="button" data-turn>Meet the team <svg aria-hidden="true"><use href="#i-turn"/></svg></button>
      <div class="panel"><div class="qr" id="qr"></div><small>Scan · Base Sepolia</small></div>
    </section>
    <section class="face back" aria-label="The Mergit team" aria-hidden="true">
      <ul class="people" id="people"></ul>
      <div class="panel">
        <div class="lockup"><svg aria-hidden="true"><use href="#mg"/></svg><p class="word">Mergit</p></div>
        <p class="team-title">The team<span>Name opens GitHub</span></p>
        <a class="site" href="https://app.mergit.site" target="_blank" rel="noopener">app.mergit.site<svg aria-hidden="true"><use href="#i-out"/></svg></a>
        <button class="turn" type="button" data-turn>Back <svg aria-hidden="true"><use href="#i-turn"/></svg></button>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Where the printed card's QR points.
const CARD_URL = "https://app.mergit.site";
// Placeholders: the five real members. An empty handle links to that site's home page.
const TEAM = [
  { name: "Member One",   role: "Co-founder",    github: "", x: "", linkedin: "" },
  { name: "Member Two",   role: "Control plane", github: "", x: "", linkedin: "" },
  { name: "Member Three", role: "Runtime",       github: "", x: "", linkedin: "" },
  { name: "Member Four",  role: "Frontend",      github: "", x: "", linkedin: "" },
  { name: "Member Five",  role: "Research",      github: "", x: "", linkedin: "" },
];
const link = (base, handle) => base + (handle ? encodeURIComponent(handle) : "");
document.getElementById("people").innerHTML = TEAM.map((m) => `
  <li class="person">
    <a class="name" href="${link("https://github.com/", m.github)}" target="_blank" rel="noopener"><b>${m.name}</b><span>${m.role}</span></a>
    <span class="icons">
      <a href="${link("https://x.com/", m.x)}" target="_blank" rel="noopener" aria-label="${m.name} on X"><svg><use href="#i-x"/></svg></a>
      <a href="${link("https://www.linkedin.com/in/", m.linkedin)}" target="_blank" rel="noopener" aria-label="${m.name} on LinkedIn"><svg><use href="#i-in"/></svg></a>
    </span>
  </li>`).join("");
if (window.QRCode) new QRCode(document.getElementById("qr"), { text: CARD_URL, width: 200, height: 200, colorDark: "#090b14", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });

const scene = document.getElementById("scene");
const [front, back] = document.querySelectorAll(".face");
const turn = () => {
  const flipped = scene.classList.toggle("flipped");
  front.setAttribute("aria-hidden", String(flipped));
  back.setAttribute("aria-hidden", String(!flipped));
};
// A tap on the card turns it over, except on a link, which opens its page instead.
document.querySelectorAll(".face").forEach((f) => f.addEventListener("click", (e) => { if (!e.target.closest("a")) turn(); }));
</script>
</body>
</html>
